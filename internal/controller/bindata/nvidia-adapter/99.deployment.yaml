apiVersion: apps/v1
kind: Deployment
metadata:
  name: opi-nvidia-dpf-adapter-controller-manager
  namespace: {{.Namespace}}
  labels:
    app: opi-nvidia-dpf-adapter
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opi-nvidia-dpf-adapter
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app: opi-nvidia-dpf-adapter
        control-plane: controller-manager
    spec:
      serviceAccountName: opi-nvidia-dpf-adapter
      containers:
        - name: manager
          image: {{.NvidiaDpfAdapterImage}}
          imagePullPolicy: {{.ImagePullPolicy}}
          args:
            - --leader-elect=false
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
