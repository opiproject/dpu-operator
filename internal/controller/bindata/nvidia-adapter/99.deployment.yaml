apiVersion: apps/v1
kind: Deployment
metadata:
  name: opi-nvidia-dpf-adapter-controller-manager
  namespace: {{.Namespace}}
  labels:
    app: opi-nvidia-dpf-adapter
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opi-nvidia-dpf-adapter
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app: opi-nvidia-dpf-adapter
        control-plane: controller-manager
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      serviceAccountName: opi-nvidia-dpf-adapter
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{.NvidiaDpfAdapterImage}}
          imagePullPolicy: {{.ImagePullPolicy}}
          command:
            - /manager
          args:
            - --leader-elect=false
            - --health-probe-bind-address=:8081
            # Image must ship FieldMappings at /mappings (adapter Dockerfile).
            - --mapping-dir=/mappings
          ports:
            - containerPort: 8081
              name: health
              protocol: TCP
          env:
            - name: HELM_CACHE_HOME
              value: /tmp/helm/cache
            - name: HELM_CONFIG_HOME
              value: /tmp/helm/config
            - name: HELM_DATA_HOME
              value: /tmp/helm/data
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: helm-cache
              mountPath: /tmp/helm
      volumes:
        - name: helm-cache
          emptyDir: {}
