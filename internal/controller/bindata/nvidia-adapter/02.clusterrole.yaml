apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opi-nvidia-dpf-adapter
  labels:
    app: opi-nvidia-dpf-adapter
rules:
  # Register and refresh VendorProvider for the SPI handshake.
  - apiGroups: ["config.openshift.io"]
    resources: ["vendorproviders"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["config.openshift.io"]
    resources: ["vendorproviders/status"]
    verbs: ["get", "update", "patch"]
  # Companion watches OPI sources (full adapter RBAC may widen later).
  - apiGroups: ["config.openshift.io"]
    resources: ["dpuoperatorconfigs", "dataprocessingunits", "servicefunctionchains"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["config.openshift.io"]
    resources: ["dpuoperatorconfigs/status", "dataprocessingunits/status", "servicefunctionchains/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["config.openshift.io"]
    resources: ["dpuoperatorconfigs/finalizers", "dataprocessingunits/finalizers", "servicefunctionchains/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
